<!DOCTYPE html>
<html lang="en" x-data="app()" :dir="dir()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Vendor Portal & Market Price Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 shadow-xs sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Logo -->
            <div class="flex items-center space-x-3 rtl:space-x-reverse">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl tracking-wider">CP</div>
                <div>
                    <span class="text-lg font-bold block leading-tight" x-text="t('brandTitle')"></span>
                    <span class="text-xs text-slate-500" x-text="t('brandSubtitle')"></span>
                </div>
            </div>

            <!-- Controls & Language Switcher -->
            <div class="flex items-center space-x-4 rtl:space-x-reverse">
                <select x-model="lang" @change="changeLang($event.target.value)" class="border border-slate-300 rounded-md px-2 py-1 text-sm bg-white focus:outline-hidden focus:ring-2 focus:ring-blue-500">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="ku">کوردی</option>
                </select>

                <template x-if="user">
                    <div class="flex items-center space-x-2 rtl:space-x-reverse">
                        <span class="text-sm font-medium text-slate-700" x-text="user.username"></span>
                        <button @click="logout()" class="text-xs bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-md hover:bg-red-100 transition" x-text="t('logout')"></button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Content Dynamic Views -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- VIEW 1: AUTHENTICATION (If not logged in) -->
        <template x-if="!user">
            <div class="max-w-md mx-auto bg-white rounded-xl shadow-xs border border-slate-200 p-8 mt-10">
                <h2 class="text-2xl font-bold mb-6 text-center" x-text="isRegistering ? t('registerTitle') : t('loginTitle')"></h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1" x-text="t('username')"></label>
                        <input type="text" x-model="authForm.username" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-hidden">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1" x-text="t('password')"></label>
                        <input type="password" x-model="authForm.password" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-hidden">
                    </div>
                    <button @click="authenticate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition" x-text="isRegistering ? t('registerBtn') : t('loginBtn')"></button>
                    
                    <p class="text-center text-sm text-slate-600 mt-4">
                        <span x-text="isRegistering ? t('hasAccount') : t('noAccount')"></span>
                        <button @click="isRegistering = !isRegistering" class="text-blue-600 font-semibold hover:underline ml-1" x-text="isRegistering ? t('loginHere') : t('registerHere')"></button>
                    </p>
                </div>
            </div>
        </template>

        <!-- VIEW 2: VENDOR SUBMISSION PORTAL (If logged in as vendor) -->
        <template x-if="user && user.role === 'vendor'">
            <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-6 md:p-8 max-w-4xl mx-auto">
                <div class="border-b border-slate-200 pb-4 mb-6">
                    <h2 class="text-xl font-bold text-slate-900" x-text="t('vendorPortalTitle')"></h2>
                    <p class="text-sm text-slate-500" x-text="t('vendorPortalSubtitle')"></p>
                </div>

                <form @submit.prevent="submitVendorData" class="space-y-6">
                    <!-- General Information Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1" x-text="t('storeName')"></label>
                            <input type="text" x-model="vendorForm.store_name" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" x-text="t('category')"></label>
                            <select x-model="vendorForm.category" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white">
                                <option value="Electronics">Electronics</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Construction/Building">Construction / Building</option>
                                <option value="Hardware">Hardware</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" x-text="t('contactNumber')"></label>
                            <input type="text" x-model="vendorForm.contact_number" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1" x-text="t('email')"></label>
                            <input type="email" x-model="vendorForm.email" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                        </div>
                    </div>

                    <!-- Dynamic Item Matrix Table -->
                    <div class="mt-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-md" x-text="t('itemMatrix')"></h3>
                            <button type="button" @click="addItemRow()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold px-3 py-1.5 rounded-lg transition" x-text="t('addItem')"></button>
                        </div>

                        <div class="overflow-x-auto border border-slate-200 rounded-lg">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                    <tr>
                                        <th class="p-3" x-text="t('itemName')"></th>
                                        <th class="p-3 w-28" x-text="t('quantity')"></th>
                                        <th class="p-3 w-36" x-text="t('unitPrice')"></th>
                                        <th class="p-3 w-36" x-text="t('totalPrice')"></th>
                                        <th class="p-3 w-16"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    <template x-for="(item, index) in vendorForm.items" :key="index">
                                        <tr>
                                            <td class="p-2">
                                                <input type="text" x-model="item.item_name" required class="w-full border border-slate-300 rounded-md p-2 text-sm">
                                            </td>
                                            <td class="p-2">
                                                <input type="number" step="any" min="0" x-model.number="item.quantity" @input="calcRow(item)" required class="w-full border border-slate-300 rounded-md p-2 text-sm">
                                            </td>
                                            <td class="p-2">
                                                <input type="number" step="any" min="0" x-model.number="item.unit_price" @input="calcRow(item)" required class="w-full border border-slate-300 rounded-md p-2 text-sm">
                                            </td>
                                            <td class="p-2 font-medium text-slate-700">
                                                <span x-text="(item.quantity * item.unit_price).toFixed(2)"></span>
                                            </td>
                                            <td class="p-2 text-center">
                                                <button type="button" @click="removeItemRow(index)" class="text-red-500 hover:text-red-700 font-bold">&times;</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Grand Total Bar -->
                        <div class="flex justify-end mt-4 bg-slate-50 p-4 rounded-lg border border-slate-200 items-center space-x-4 rtl:space-x-reverse">
                            <span class="text-base font-bold text-slate-700" x-text="t('grandTotal') + ':'"></span>
                            <span class="text-xl font-extrabold text-blue-600" x-text="grandTotal().toFixed(2)"></span>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition" x-text="t('submitPortal')"></button>
                </form>
            </div>
        </template>

        <!-- VIEW 3: ADMIN DASHBOARD (If logged in as admin) -->
        <template x-if="user && user.role === 'admin'">
            <div class="space-y-8">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900" x-text="t('adminDashboard')"></h2>
                        <p class="text-sm text-slate-500" x-text="t('adminSubtitle')"></p>
                    </div>
                    <button @click="loadAdminData()" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm hover:bg-slate-100 transition" x-text="t('refreshData')"></button>
                </div>

                <!-- Price Competitiveness Analytics Section -->
                <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-6">
                    <h3 class="text-lg font-bold mb-4 text-slate-800" x-text="t('marketAnalysis')"></h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                <tr>
                                    <th class="p-3" x-text="t('itemName')"></th>
                                    <th class="p-3 text-emerald-600" x-text="t('minPrice')"></th>
                                    <th class="p-3 text-emerald-600" x-text="t('bestStore')"></th>
                                    <th class="p-3 text-rose-600" x-text="t('maxPrice')"></th>
                                    <th class="p-3 text-rose-600" x-text="t('highestStore')"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                <template x-for="row in analytics">
                                    <tr>
                                        <td class="p-3 font-semibold text-slate-800" x-text="row.item_name"></td>
                                        <td class="p-3 font-bold text-emerald-700" x-text="row.min_price"></td>
                                        <td class="p-3 bg-emerald-50 text-emerald-900 font-medium rounded-xs" x-text="row.min_store"></td>
                                        <td class="p-3 font-bold text-rose-700" x-text="row.max_price"></td>
                                        <td class="p-3 bg-rose-50 text-rose-900 font-medium rounded-xs" x-text="row.max_store"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- All Submissions Log -->
                <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-6">
                    <h3 class="text-lg font-bold mb-4 text-slate-800" x-text="t('allSubmissions')"></h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                                <tr>
                                    <th class="p-3" x-text="t('date')"></th>
                                    <th class="p-3" x-text="t('storeName')"></th>
                                    <th class="p-3" x-text="t('category')"></th>
                                    <th class="p-3" x-text="t('contactNumber')"></th>
                                    <th class="p-3" x-text="t('email')"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                <template x-for="sub in submissions">
                                    <tr>
                                        <td class="p-3 text-slate-500" x-text="sub.created_at"></td>
                                        <td class="p-3 font-semibold text-slate-800" x-text="sub.store_name"></td>
                                        <td class="p-3" x-text="sub.category"></td>
                                        <td class="p-3" x-text="sub.contact_number"></td>
                                        <td class="p-3" x-text="sub.email"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-12">
        <p x-text="t('footerText')"></p>
    </footer>

    <!-- Frontend Core Application Script -->
    <script>
        function app() {
            return {
                lang: 'en',
                user: JSON.parse(localStorage.getItem('user')) || null,
                isRegistering: false,
                authForm: { username: '', password: '' },
                vendorForm: {
                    store_name: '',
                    category: 'Electronics',
                    contact_number: '',
                    email: '',
                    items: [{ item_name: '', quantity: 1, unit_price: 0 }]
                },
                submissions: [],
                analytics: [],
                
                translations: {
                    en: {
                        brandTitle: "Corporate Market Portal",
                        brandSubtitle: "Vendor Price Submissions & Intelligence",
                        logout: "Logout",
                        loginTitle: "Sign In to Your Account",
                        registerTitle: "Vendor Account Registration",
                        username: "Username",
                        password: "Password",
                        loginBtn: "Sign In",
                        registerBtn: "Register Account",
                        noAccount: "Don't have an account?",
                        hasAccount: "Already have an account?",
                        registerHere: "Register here",
                        loginHere: "Sign in here",
                        vendorPortalTitle: "Vendor Price Submission Portal",
                        vendorPortalSubtitle: "Enter corporate exhibition/store data and item quotation details below.",
                        storeName: "Store / Exhibition / Company Name",
                        category: "Product Category",
                        contactNumber: "Contact Number",
                        email: "Email Address",
                        itemMatrix: "Dynamic Product & Pricing Matrix",
                        addItem: "+ Add Row",
                        itemName: "Item Name",
                        quantity: "Quantity",
                        unitPrice: "Unit Price",
                        totalPrice: "Total Price",
                        grandTotal: "Grand Total Sum",
                        submitPortal: "Submit Quotation",
                        adminDashboard: "Admin Management Dashboard",
                        adminSubtitle: "Monitor competitor pricing and analysis reports",
                        refreshData: "Refresh Analytics",
                        marketAnalysis: "Market Competitiveness Analysis (Min/Max Pricing)",
                        minPrice: "Min Unit Price",
                        bestStore: "Lowest Store Name",
                        maxPrice: "Max Unit Price",
                        highestStore: "Highest Store Name",
                        allSubmissions: "Recent Vendor Submissions Log",
                        date: "Date & Time",
                        footerText: "© 2026 Corporate Portal Framework. 100% Free Hosting Design."
                    },
                    ar: {
                        brandTitle: "بوابة الشركات التجارية",
                        brandSubtitle: "تقديم الأسعار وتحليلات السوق للوكلاء",
                        logout: "تسجيل الخروج",
                        loginTitle: "تسجيل الدخول إلى حسابك",
                        registerTitle: "تسجيل حساب وكيل جديد",
                        username: "اسم المستخدم",
                        password: "كلمة المرور",
                        loginBtn: "دخول",
                        registerBtn: "إنشاء حساب",
                        noAccount: "ليس لديك حساب؟",
                        hasAccount: "لديك حساب بالفعل؟",
                        registerHere: "سجل هنا",
                        loginHere: "سجل دخولك هنا",
                        vendorPortalTitle: "بوابة تقديم أسعار الموردين",
                        vendorPortalSubtitle: "أدخل تفاصيل المعرض/الشركة وبيانات تسعير المنتجات أدناه.",
                        storeName: "اسم المتجر / المعرض / الشركة",
                        category: "فئة المنتج",
                        contactNumber: "رقم الاتصال",
                        email: "البريد الإلكتروني",
                        itemMatrix: "جدول المنتجات والأسعار الديناميكي",
                        addItem: "+ إضافة عنصر",
                        itemName: "اسم المادة",
                        quantity: "الكمية",
                        unitPrice: "سعر الوحدة",
                        totalPrice: "المجموع الكلي",
                        grandTotal: "المجموع الإجمالي النهائي",
                        submitPortal: "إرسال عروض الأسعار",
                        adminDashboard: "لوحة تحكم المشرف",
                        adminSubtitle: "مراقبة أسعار المنافسين وتقارير التحليل الذكية",
                        refreshData: "تحديث البيانات",
                        marketAnalysis: "تحليل تنافسية السوق (الحد الأدنى والأقصى للأسعار)",
                        minPrice: "أقل سعر للوحدة",
                        bestStore: "اسم المتجر الأقل سعراً",
                        maxPrice: "أعلى سعر للوحدة",
                        highestStore: "اسم المتجر الأعلى سعراً",
                        allSubmissions: "سجل تقديمات الوكلاء الأخيرة",
                        date: "التاريخ والوقت",
                        footerText: "© 2026 إطار بوابة الشركات. تصميم مخصص للاستضافة المجانية."
                    },
                    ku: {
                        brandTitle: "دەروازەی کۆمپانیاکان",
                        brandSubtitle: "پێشکەشکردنی نرخ و شیکاری بازاڕ بۆ فروۆشیاران",
                        logout: "چوونەدەرەوە",
                        loginTitle: "چوونەژوورەوە بۆ هەژمارەکەت",
                        registerTitle: "تۆمارکردنی هەژماری نوێ",
                        username: "ناوی بەکارهێنەر",
                        password: "وشەی نهێنی",
                        loginBtn: "چوونەژوورەوە",
                        registerBtn: "تۆمارکردن",
                        noAccount: "هەژمارت نییە؟",
                        hasAccount: "پێشتر هەژمارت هەیە؟",
                        registerHere: "لێرە تۆمار بکە",
                        loginHere: "لێرە بچۆ ژوورەوە",
                        vendorPortalTitle: "دەروازەی پێشکەشکردنی نرخ",
                        vendorPortalSubtitle: "زانیاری پێشانگا/کۆمپانیا و خشتەی نرخەکان لە خوارەوە پڕبکەرەوە.",
                        storeName: "ناوی دووکان / پێشانگا / کۆمپانیا",
                        category: "پۆلێنی بەرهەم",
                        contactNumber: "ژمارەی پەیوەندی",
                        email: "ئیمەیل",
                        itemMatrix: "خشتەی داینامیکی بەرهەم و نرخەکان",
                        addItem: "+ زیادکردنی ڕیز",
                        itemName: "ناوی شتومەک",
                        quantity: "دانە / بڕ",
                        unitPrice: "نرخی تاک",
                        totalPrice: "کۆی گشتی",
                        grandTotal: "کۆی کۆیان",
                        submitPortal: "ناردنی نرخەکان",
                        adminDashboard: "پאנەڵی بەڕێوەبەر",
                        adminSubtitle: "چاودێریکردنی نرخی ڕکابەرەکان و راپۆرتی شیکاری",
                        refreshData: "نوێکردنەوەی زانیاری",
                        marketAnalysis: "شیکاری کێبڕکێی بازاڕ (کەمترین و زۆرترین نرخ)",
                        minPrice: "کەمترین نرخی تاک",
                        bestStore: "ناوی هەرزانترین فرۆشیار",
                        maxPrice: "زۆرترین نرخی تاک",
                        highestStore: "ناوی گرانترین فرۆشیار",
                        allSubmissions: "تۆمارەکانی پێشووی فرۆشیاران",
                        date: "رێکەوت و کات",
                        footerText: "© 2026 دەروازەی بازرگانی. دیزاینکراوە بۆ هۆستکردنی خۆڕایی."
                    }
                },

                t(key) {
                    return this.translations[this.lang][key] || key;
                },

                dir() {
                    return (this.lang === 'ar' || this.lang === 'ku') ? 'rtl' : 'ltr';
                },

                changeLang(newLang) {
                    this.lang = newLang;
                },

                addItemRow() {
                    this.vendorForm.items.push({ item_name: '', quantity: 1, unit_price: 0 });
                },

                removeItemRow(index) {
                    if (this.vendorForm.items.length > 1) {
                        this.vendorForm.items.splice(index, 1);
                    }
                },

                calcRow(item) {
                    if(item.quantity < 0) item.quantity = 0;
                    if(item.unit_price < 0) item.unit_price = 0;
                },

                grandTotal() {
                    return this.vendorForm.items.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
                },

                async authenticate() {
                    try {
                        const action = this.isRegistering ? 'register' : 'login';
                        const res = await fetch('/api/auth', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...this.authForm, action })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.user = { username: this.authForm.username, role: data.role || 'vendor' };
                            localStorage.setItem('user', JSON.stringify(this.user));
                            if (this.user.role === 'admin') this.loadAdminData();
                        } else {
                            alert(data.error);
                        }
                    } catch (e) {
                        alert('Authentication connection error.');
                    }
                },

                logout() {
                    this.user = null;
                    localStorage.removeItem('user');
                },

                async submitVendorData() {
                    try {
                        const res = await fetch('/api/submissions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.vendorForm)
                        });
                        if (res.ok) {
                            alert('Quotation submitted successfully!');
                            this.vendorForm = {
                                store_name: '',
                                category: 'Electronics',
                                contact_number: '',
                                email: '',
                                items: [{ item_name: '', quantity: 1, unit_price: 0 }]
                            };
                        } else {
                            alert('Error saving submission.');
                        }
                    } catch (e) {
                        alert('Server submission error.');
                    }
                },

                async loadAdminData() {
                    try {
                        const res = await fetch('/api/admin/analytics');
                        const data = await res.json();
                        if (res.ok) {
                            this.submissions = data.submissions;
                            this.analytics = data.analytics;
                        }
                    } catch (e) {
                        console.error('Failed to load admin dashboard insights.');
                    }
                },

                init() {
                    if (this.user && this.user.role === 'admin') {
                        this.loadAdminData();
                    }
                }
            }
        }
    </script>
</body>
</html>
