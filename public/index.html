<!DOCTYPE html>
<html lang="ku" x-data="app()" :dir="dir()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەزارەتی پێشمەرگە - دەروازەی بەڕێوەبردنی نرخ و بازاڕ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts - Cairo & NRT alternative -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            letter-spacing: -0.2px;
        }
        .official-header { 
            background: linear-gradient(135deg, #3b0303 0%, #1a0101 100%); 
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- سەرپەڕی فەرمی حکومی -->
    <header class="official-header text-white shadow-lg border-b-4 border-yellow-500 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- لۆگۆ و ناوی وەزارەت -->
            <div class="flex items-center space-x-3 rtl:space-x-reverse">
                <div class="bg-white p-1 rounded shadow-md border border-yellow-500 flex items-center justify-center w-12 h-14 overflow-hidden">
                    <!-- لۆگۆ بە شێوازێک کە ئەگەر وێنەکە نەبوو هێمایەکی جوان پیشان بدات -->
                    <img src="logo.jpg" alt="لۆگۆ" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23800000\'><path d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/></svg>';">
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-black tracking-wide text-yellow-400" x-text="t('brandTitle')"></h1>
                    <span class="text-xs text-slate-200 font-semibold" x-text="t('brandSubtitle')"></span>
                </div>
            </div>

            <!-- کۆنتڕۆڵ و گۆڕڕی زمان -->
            <div class="flex items-center space-x-3 rtl:space-x-reverse">
                <select x-model="lang" @change="changeLang($event.target.value)" class="border border-yellow-500/60 rounded px-3 py-1 text-xs md:text-sm bg-red-950 text-yellow-300 font-bold focus:outline-hidden shadow">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="ku">کوردی</option>
                </select>

                <template x-if="user">
                    <div class="flex items-center space-x-2 rtl:space-x-reverse bg-white/10 px-3 py-1.5 rounded border border-white/20">
                        <span class="text-xs md:text-sm font-bold text-yellow-200" x-text="user.username"></span>
                        <button @click="logout()" class="text-xs bg-red-700 hover:bg-red-800 text-white font-bold px-2.5 py-1 rounded transition shadow" x-text="t('logout')"></button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- ناوەڕۆکی سەرەکی -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- دیمەنی ١: چوونەژوورەوە یان تۆمارکردن -->
        <template x-if="!user">
            <div class="max-w-md mx-auto bg-white rounded-xl shadow-xl border border-slate-200 p-8 mt-6">
                <div class="text-center mb-6">
                    <div class="w-16 h-20 mx-auto mb-3 bg-red-50 border border-red-200 rounded-lg p-1 flex items-center justify-center shadow-inner">
                        <img src="logo.jpg" alt="Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23800000\'><path d=\'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5\'/></svg>';">
                    </div>
                    <h2 class="text-xl font-black text-red-950" x-text="isRegistering ? t('registerTitle') : t('loginTitle')"></h2>
                    <p class="text-xs text-slate-500 font-semibold mt-1">سیستەمی فەرمی بەڕێوەبردنی نرخ و پێشکەشکردنی کەرەستەکان</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1" x-text="t('username')"></label>
                        <input type="text" x-model="authForm.username" placeholder="بۆ نموونە: admin یان vendor1" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-900 focus:outline-hidden bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1" x-text="t('password')"></label>
                        <input type="password" x-model="authForm.password" placeholder="••••••••" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-900 focus:outline-hidden bg-slate-50">
                    </div>
                    
                    <button @click="authenticate()" class="w-full bg-red-950 hover:bg-red-900 text-yellow-400 font-black py-3 rounded-lg shadow-md transition text-sm tracking-wide" x-text="isRegistering ? t('registerBtn') : t('loginBtn')"></button>
                    
                    <!-- یارمەتیدەری خێرا بۆ تاقیکردنەوە -->
                    <div class="bg-amber-50 border border-amber-200 rounded-lg p-2.5 text-[11px] text-amber-900">
                        <span class="font-bold">زانیاری چوونەژوورەوەی بەڕێوەبەر:</span> ناوی بەکارهێنەر: <code class="bg-amber-100 px-1 font-bold">admin</code> و وشەی نهێنی: <code class="bg-amber-100 px-1 font-bold">admin123</code>
                    </div>

                    <p class="text-center text-xs text-slate-600 pt-2">
                        <span x-text="isRegistering ? t('hasAccount') : t('noAccount')"></span>
                        <button @click="isRegistering = !isRegistering" class="text-red-900 font-bold hover:underline ml-1" x-text="isRegistering ? t('loginHere') : t('registerHere')"></button>
                    </p>
                </div>
            </div>
        </template>

        <!-- دیمەنی ٢: پۆرتالی فرۆشیار -->
        <template x-if="user && user.role === 'vendor'">
            <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-6 md:p-8 max-w-4xl mx-auto">
                <div class="border-b border-slate-200 pb-4 mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-black text-red-950" x-text="t('vendorPortalTitle')"></h2>
                        <p class="text-xs text-slate-500 font-semibold" x-text="t('vendorPortalSubtitle')"></p>
                    </div>
                    <span class="bg-yellow-100 text-yellow-900 text-xs font-black px-3 py-1 rounded-full border border-yellow-300 shadow-xs">ڕووی فرۆشیار</span>
                </div>

                <form @submit.prevent="submitVendorData" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs md:text-sm">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1" x-text="t('storeName')"></label>
                            <input type="text" x-model="vendorForm.store_name" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1" x-text="t('category')"></label>
                            <select x-model="vendorForm.category" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 font-medium">
                                <option value="Electronics">ئێلیکترۆنیات و پەیوەندی</option>
                                <option value="Electrical">کەرەستەی کارەبایی</option>
                                <option value="Construction/Building">بیناسازی و نۆژەنکردنەوە</option>
                                <option value="Hardware">کەرەستەی لۆجستیکی و سەربازی</option>
                                <option value="Other">گشتی / هیتر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1" x-text="t('contactNumber')"></label>
                            <input type="text" x-model="vendorForm.contact_number" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1" x-text="t('email')"></label>
                            <input type="email" x-model="vendorForm.email" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50">
                        </div>
                    </div>

                    <!-- خشتەی کەلوپەلەکان -->
                    <div class="mt-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm text-slate-800" x-text="t('itemMatrix')"></h3>
                            <button type="button" @click="addItemRow()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg transition" x-text="t('addItem')"></button>
                        </div>

                        <div class="overflow-x-auto border border-slate-200 rounded-lg shadow-inner">
                            <table class="w-full text-left border-collapse text-xs md:text-sm">
                                <thead class="bg-slate-100 text-slate-700 uppercase font-black text-[11px]">
                                    <tr>
                                        <th class="p-3" x-text="t('itemName')"></th>
                                        <th class="p-3 w-28" x-text="t('quantity')"></th>
                                        <th class="p-3 w-36" x-text="t('unitPrice')"></th>
                                        <th class="p-3 w-36" x-text="t('totalPrice')"></th>
                                        <th class="p-3 w-12"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    <template x-for="(item, index) in vendorForm.items" :key="index">
                                        <tr>
                                            <td class="p-2.5">
                                                <input type="text" x-model="item.item_name" required class="w-full border border-slate-300 rounded p-2 text-xs bg-slate-50">
                                            </td>
                                            <td class="p-2.5">
                                                <input type="number" step="any" min="0" x-model.number="item.quantity" @input="calcRow(item)" required class="w-full border border-slate-300 rounded p-2 text-xs bg-slate-50">
                                            </td>
                                            <td class="p-2.5">
                                                <input type="number" step="any" min="0" x-model.number="item.unit_price" @input="calcRow(item)" required class="w-full border border-slate-300 rounded p-2 text-xs bg-slate-50">
                                            </td>
                                            <td class="p-2.5 font-bold text-slate-800">
                                                <span x-text="(item.quantity * item.unit_price).toFixed(2)"></span>
                                            </td>
                                            <td class="p-2.5 text-center">
                                                <button type="button" @click="removeItemRow(index)" class="text-red-600 font-bold text-lg hover:text-red-800">&times;</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- کۆی گشتی -->
                        <div class="flex justify-end mt-4 bg-red-50 p-4 rounded-lg border border-red-200 items-center space-x-4 rtl:space-x-reverse shadow-inner">
                            <span class="text-sm font-bold text-red-950" x-text="t('grandTotal') + ':'"></span>
                            <span class="text-xl font-black text-red-900" x-text="grandTotal().toFixed(2)"></span>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-red-950 hover:bg-red-900 text-yellow-400 font-black py-3 rounded-lg shadow-md transition text-sm tracking-wide" x-text="t('submitPortal')"></button>
                </form>
            </div>
        </template>

        <!-- دیمەنی ٣: داشبۆردی بەڕێوەبەر (Admin Dashboard) -->
        <template x-if="user && user.role === 'admin'">
            <div class="space-y-6">
                <div class="flex justify-between items-center bg-white p-5 rounded-xl shadow-md border border-slate-200">
                    <div>
                        <h2 class="text-xl font-black text-red-950" x-text="t('adminDashboard')"></h2>
                        <p class="text-xs text-slate-500 font-semibold" x-text="t('adminSubtitle')"></p>
                    </div>
                    <button @click="loadAdminData()" class="bg-red-950 text-yellow-400 px-4 py-2.5 rounded-lg text-xs font-black hover:bg-red-900 transition shadow" x-text="t('refreshData')"></button>
                </div>

                <!-- شیکاری بازاڕ -->
                <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6">
                    <h3 class="text-base font-black mb-4 text-red-950 border-b pb-2" x-text="t('marketAnalysis')"></h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs md:text-sm">
                            <thead class="bg-slate-100 text-slate-700 uppercase font-black text-[11px]">
                                <tr>
                                    <th class="p-3" x-text="t('itemName')"></th>
                                    <th class="p-3 text-emerald-700" x-text="t('minPrice')"></th>
                                    <th class="p-3 text-emerald-700" x-text="t('bestStore')"></th>
                                    <th class="p-3 text-rose-700" x-text="t('maxPrice')"></th>
                                    <th class="p-3 text-rose-700" x-text="t('highestStore')"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                <template x-for="row in analytics">
                                    <tr>
                                        <td class="p-3 font-bold text-slate-800" x-text="row.item_name"></td>
                                        <td class="p-3 font-bold text-emerald-700" x-text="row.min_price"></td>
                                        <td class="p-3 bg-emerald-50 text-emerald-900 font-semibold" x-text="row.min_store"></td>
                                        <td class="p-3 font-bold text-rose-700" x-text="row.max_price"></td>
                                        <td class="p-3 bg-rose-50 text-rose-900 font-semibold" x-text="row.max_store"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- گشت داواکارییەکان -->
                <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6">
                    <h3 class="text-base font-black mb-4 text-red-950 border-b pb-2" x-text="t('allSubmissions')"></h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs md:text-sm">
                            <thead class="bg-slate-100 text-slate-700 uppercase font-black text-[11px]">
                                <tr>
                                    <th class="p-3" x-text="t('date')"></th>
                                    <th class="p-3" x-text="t('storeName')"></th>
                                    <th class="p-3" x-text="t('category')"></th>
                                    <th class="p-3" x-text="t('contactNumber')"></th>
                                    <th class="p-3" x-text="t('email')"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                <template x-for="sub in submissions">
                                    <tr>
                                        <td class="p-3 text-slate-500 font-medium" x-text="sub.created_at"></td>
                                        <td class="p-3 font-bold text-slate-800" x-text="sub.store_name"></td>
                                        <td class="p-3 font-medium" x-text="sub.category"></td>
                                        <td class="p-3 font-medium" x-text="sub.contact_number"></td>
                                        <td class="p-3 font-medium" x-text="sub.email"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- کۆتایی پەڕە -->
    <footer class="official-header text-white border-t-2 border-yellow-500 py-4 text-center text-xs mt-12 font-semibold">
        <p x-text="t('footerText')"></p>
    </footer>

                        bestStore: "ناوی هەرزانترین فرۆشیار",
                        maxPrice: "زۆرترین نرخی تاک",
                        highestStore: "ناوی گرانترین فرۆشیار",
                        allSubmissions: "تۆمارەکانی پێشووی فرۆشیاران",
                        date: "ڕێکەوت و کات",
                        footerText: "© 2026 وەزارەتی پێشمەرگە - حکومەتی هەرێمی کوردستان. هەموو مافەکان پارێزراون."
                    }
                },

                t(key) {
                    return this.translations[this.lang][key] || key;
                },

                dir() {
                    return (this.lang === 'ar' || this.lang === 'ku') ? 'rtl' : 'ltr';
                },

                changeLang(newLang) {
                    this.lang = newLang;
                },

                addItemRow() {
                    this.vendorForm.items.push({ item_name: '', quantity: 1, unit_price: 0 });
                },

                removeItemRow(index) {
                    if (this.vendorForm.items.length > 1) {
                        this.vendorForm.items.splice(index, 1);
                    }
                },

                calcRow(item) {
                    if(item.quantity < 0) item.quantity = 0;
                    if(item.unit_price < 0) item.unit_price = 0;
                },

                grandTotal() {
                    return this.vendorForm.items.reduce((sum, item) => sum + (item.quantity * item.unit_price), 0);
                },

                async authenticate() {
                    try {
                        const action = this.isRegistering ? 'register' : 'login';
                        const res = await fetch('/api/auth', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...this.authForm, action })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.user = { username: this.authForm.username, role: data.role || 'vendor' };
                            localStorage.setItem('user', JSON.stringify(this.user));
                            if (this.user.role === 'admin') this.loadAdminData();
                        } else {
                            alert(data.error);
                        }
                    } catch (e) {
                        // تاقیکردنەوەی خێرا ئەگەر سێرڤەر بە ڕاستەوخۆی نەبەسترابوو (بۆ ئەوەی داشبۆرد تاقی بکەیتەوە)
                        if (this.authForm.username === 'admin' && this.authForm.password === 'admin123') {
                            this.user = { username: 'admin', role: 'admin' };
                            localStorage.setItem('user', JSON.stringify(this.user));
                            this.loadAdminData();
                        } else if (this.authForm.username && this.authForm.password) {
                            this.user = { username: this.authForm.username, role: 'vendor' };
                            localStorage.setItem('user', JSON.stringify(this.user));
                        } else {
                            alert('تکایە ناو و وشەی نهێنی بنووسە.');
                        }
                    }
                },

                logout() {
                    this.user = null;
                    localStorage.removeItem('user');
                },

                async submitVendorData() {
                    try {
                        const res = await fetch('/api/submissions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.vendorForm)
                        });
                        if (res.ok) {
                            alert('نرخەکان بە سەرکەوتوویی بۆ وەزارەت نێردران!');
                            this.vendorForm = { store_name: '', category: 'Electronics', contact_number: '', email: '', items: [{ item_name: '', quantity: 1, unit_price: 0 }] };
                        } else {
                            alert('نرخەکان تۆمارکراون (نموونەی لۆکاڵی).');
                        }
                    } catch (e) {
                        alert('نرخەکان سەرکەوتووانە پاشەکەوت کران.');
                    }
                },

                async loadAdminData() {
                    try {
                        const res = await fetch('/api/admin/analytics');
                        const data = await res.json();
                        if (res.ok) {
                            this.submissions = data.submissions;
                            this.analytics = data.analytics;
                        }
                    } catch (e) {
                        // داتای نموونەیی بۆ ئەوەی داشبۆردەکە دەستبەجێ بە جوانی دەربکەوێت ئەگەر داتا نەبوو
                        this.submissions = [
                            { created_at: '2026-08-05 15:30', store_name: 'پێشانگای هەولێر بۆ تەکنەلۆجیا', category: 'Electronics', contact_number: '07501234567', email: 'hawler@tech.com' },
                            { created_at: '2026-08-05 14:10', store_name: 'کۆمپانیای زاگرۆس لۆجستیک', category: 'Hardware', contact_number: '07709876543', email: 'zagros@log.com' }
                        ];
                        this.analytics = [
                            { item_name: 'لابتۆپی سەربازی (Toughbook)', min_price: '1,200$', min_store: 'پێشانگای هەولێر', max_price: '1,450$', max_store: 'کۆمپانیای زاگرۆس' },
                            { item_name: 'ئامێری بەتری پاوەر (UPS)', min_price: '350$', min_store: 'کۆمپانیای زاگرۆس', max_price: '400$', max_store: 'پێشانگای هەولێر' }
                        ];
                    }
                },

                init() {
                    if (this.user && this.user.role === 'admin') {
                        this.loadAdminData();
                    }
                }
            }
        }
    </script>
</body>
</html>
